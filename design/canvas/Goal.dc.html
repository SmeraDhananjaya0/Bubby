<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — your goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1F3FC9;text-decoration:none}a:hover{color:#1733A8}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #1B1A19; background: radial-gradient(90% 40% at 6% -4%, rgba(110, 140, 250, 0.42) 0%, rgba(110, 140, 250, 0) 70%), radial-gradient(80% 36% at 100% 0%, rgba(150, 190, 250, 0.42) 0%, rgba(150, 190, 250, 0) 70%), radial-gradient(70% 28% at 55% 14%, rgba(255, 222, 170, 0.34) 0%, rgba(255, 222, 170, 0) 70%), #F6F5F1;">

  <div class="scroll" style="position: absolute; top: 0px; left: 0px; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 62px 20px 130px 20px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E4E3DD;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6E67;">Step 3 of 4</div>
      <h1 style="margin: 0; font-size: 36px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em;">Your goal</h1>
    </div>

    <div role="group" aria-label="Race distance" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{distances}}" as="d" hint-placeholder-count="4">
        <button onClick="{{d.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 18px 18px; border: 0px; border-radius: 20px; background: #FFFFFF; box-shadow: {{d.shadow}}; text-align: left;">
          <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: {{d.color}};">{{d.label}}</span>
          <span style="font-size: 13px; font-weight: 600; color: #6F6E67;">{{d.miles}}</span>
        </button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 6px 18px 6px 18px; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05); display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0px; border-bottom: 1px solid #F0EFEA;">
        <label for="race-date" style="font-size: 15px; font-weight: 600; color: #5E5D58;">Race date</label>
        <input id="race-date" type="text" defaultValue="Dec 6, 2026" style="width: 150px; border: 0px; background: transparent; text-align: right; font-size: 20px; font-weight: 800; color: #1B1A19; outline: none; padding: 0px;">
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0px; border-bottom: 1px solid #F0EFEA;">
        <label for="goal-time" style="font-size: 15px; font-weight: 600; color: #5E5D58;">Goal time</label>
        <input id="goal-time" type="text" key="{{goalKey}}" defaultValue="{{goalTime}}" style="width: 150px; border: 0px; background: transparent; text-align: right; font-size: 20px; font-weight: 800; color: #1B1A19; outline: none; padding: 0px;">
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0px;">
        <div style="font-size: 15px; font-weight: 600; color: #5E5D58;">Run days per week</div>
        <div style="display: flex; align-items: center; gap: 4px;">
          <button onClick="{{fewer}}" aria-label="Fewer days" style="width: 36px; height: 36px; border: 0px; border-radius: 18px; background: #F3F2EE; color: #1B1A19; display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
          </button>
          <div style="width: 36px; text-align: center; font-size: 20px; font-weight: 800;">{{days}}</div>
          <button onClick="{{more}}" aria-label="More days" style="width: 36px; height: 36px; border: 0px; border-radius: 18px; background: #F3F2EE; color: #1B1A19; display: flex; align-items: center; justify-content: center;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(42, 82, 240, 0.10);">
      <div style="color: #1F3FC9; display: flex; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><path d="M4 22v-7"></path></svg>
      </div>
      <div style="font-size: 13px; line-height: 18px; font-weight: 600; color: #1B338F;">{{weeksOut}} weeks out at {{days}} runs a week. Your goal pace works out to {{goalPace}} /mi.</div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px;">
    <a href="PlanPreview.dc.html" style="width: 100%; height: 54px; box-sizing: border-box; border-radius: 17px; background: #1B1A19; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center;">Build my plan</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { distance: 'Marathon', days: 5 };
  }
  renderVals() {
    const sel = this.state.distance;
    const list = [
      { label: '5K', miles: '3.1 mi', mi: 3.1, goal: '22:30', secs: 22 * 60 + 30 },
      { label: '10K', miles: '6.2 mi', mi: 6.2, goal: '47:00', secs: 47 * 60 },
      { label: 'Half', miles: '13.1 mi', mi: 13.1, goal: '1:45:00', secs: 105 * 60 },
      { label: 'Marathon', miles: '26.2 mi', mi: 26.2, goal: '3:45:00', secs: 225 * 60 }
    ];
    const distances = list.map((d) => ({
      ...d,
      pick: () => this.setState({ distance: d.label }),
      color: d.label === sel ? '#1F3FC9' : '#1B1A19',
      shadow: d.label === sel
        ? '0 0 0 2px #2A52F0, 0 10px 30px rgba(27, 26, 25, 0.05)'
        : '0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05)'
    }));
    const chosen = list.find((d) => d.label === sel) || list[3];
    const paceSec = chosen.secs / chosen.mi;
    const m = Math.floor(paceSec / 60), s = Math.round(paceSec % 60);
    const goalPace = m + ':' + (s < 10 ? '0' : '') + s;

    const race = new Date('2026-12-06T00:00:00');
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weeksOut = Math.max(1, Math.round((race - today) / (7 * 86400000)));

    return {
      distances,
      days: this.state.days,
      fewer: () => this.setState({ days: Math.max(3, this.state.days - 1) }),
      more: () => this.setState({ days: Math.min(7, this.state.days + 1) }),
      goalPace,
      goalTime: chosen.goal,
      goalKey: 'goal-' + chosen.label,
      weeksOut
    };
  }
}
</script>
</body>
</html>
