<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — you're connected</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1F3FC9;text-decoration:none}a:hover{color:#1733A8}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #1B1A19; background: radial-gradient(90% 40% at 6% -4%, rgba(110, 140, 250, 0.42) 0%, rgba(110, 140, 250, 0) 70%), radial-gradient(80% 36% at 100% 0%, rgba(150, 190, 250, 0.42) 0%, rgba(150, 190, 250, 0) 70%), radial-gradient(70% 28% at 55% 14%, rgba(255, 222, 170, 0.34) 0%, rgba(255, 222, 170, 0) 70%), #F6F5F1;">

  <div class="scroll" style="position: absolute; top: 0px; left: 0px; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 62px 20px 130px 20px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E4E3DD;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E4E3DD;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E4E3DD;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6E67;">214 runs synced</div>
      <h1 style="margin: 0; font-size: 36px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em;">You're connected</h1>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 18px 18px 18px; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5E5D58;">Weekly avg</div>
        <div style="display: flex; align-items: baseline; gap: 4px;"><span style="font-size: 32px; line-height: 34px; font-weight: 800; letter-spacing: -0.03em; color: #0E7C74;">28</span><span style="font-size: 13px; font-weight: 700; color: #6F6E67;">mi</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5E5D58;">Resting HR</div>
        <div style="display: flex; align-items: baseline; gap: 4px;"><span style="font-size: 32px; line-height: 34px; font-weight: 800; letter-spacing: -0.03em; color: #1F3FC9;">52</span><span style="font-size: 13px; font-weight: 700; color: #6F6E67;">bpm</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5E5D58;">Max HR</div>
        <div style="display: flex; align-items: baseline; gap: 4px;"><span style="font-size: 32px; line-height: 34px; font-weight: 800; letter-spacing: -0.03em; color: #1F3FC9;">188</span><span style="font-size: 13px; font-weight: 700; color: #6F6E67;">bpm</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5E5D58;">Threshold</div>
        <div style="display: flex; align-items: baseline; gap: 4px;"><span style="font-size: 32px; line-height: 34px; font-weight: 800; letter-spacing: -0.03em; color: #5B4BD6;">7:55</span><span style="font-size: 13px; font-weight: 700; color: #6F6E67;">/mi</span></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px 18px 18px; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05); display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 6px; color: #0E7C74; font-size: 15px; font-weight: 700;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 7l-8.5 8.5-5-5L2 17"></path><path d="M16 7h6v6"></path></svg>
          <span>Last 12 weeks</span>
        </div>
        <div style="color: #6F6E67; font-size: 13px; font-weight: 600;">Miles per week</div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 6px; height: 150px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="12">
          <div style="flex-grow: 1; height: {{b.h}}px; border-radius: 7px; background: {{b.bg}};"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #6F6E67; letter-spacing: 0.04em; text-transform: uppercase;">
        <span>12 wks ago</span>
        <span style="color: #0E7C74;">Last 3 weeks · 34 mi avg</span>
      </div>
    </div>

    <div style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5E5D58; padding: 0px 4px;">Heart rate, pace and elevation from these runs shape your zones, your paces and your plan.</div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px;">
    <a href="AboutYou.dc.html" style="width: 100%; height: 54px; box-sizing: border-box; border-radius: 17px; background: #1B1A19; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center;">Continue</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const miles = [18, 22, 15, 24, 27, 20, 28, 30, 24, 32, 34, 36];
    const max = 36, H = 150;
    const bars = miles.map((m, i) => ({
      h: Math.round((m / max) * H),
      bg: i >= 9 ? '#22B3A6' : 'rgba(34, 179, 166, 0.32)'
    }));
    return { bars };
  }
}
</script>
</body>
</html>
