<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recap — how yesterday's fueling went</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1F3FC9;text-decoration:none}a:hover{color:#1733A8}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #1B1A19; background: radial-gradient(90% 40% at 6% -4%, rgba(110, 140, 250, 0.42) 0%, rgba(110, 140, 250, 0) 70%), radial-gradient(80% 36% at 100% 0%, rgba(255, 205, 120, 0.40) 0%, rgba(255, 205, 120, 0) 70%), radial-gradient(70% 28% at 55% 14%, rgba(150, 190, 250, 0.22) 0%, rgba(150, 190, 250, 0) 70%), #F6F5F1;">

  <div class="scroll" style="position: absolute; top: 0px; left: 0px; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 62px 20px 130px 20px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 6px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6E67;">Recap</div>
        <h1 style="margin: 0; font-size: 36px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em;">Yesterday</h1>
      </div>
      <a href="TodayFuel.dc.html" aria-label="Close" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255, 255, 255, 0.85); color: #1B1A19; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.08);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg>
      </a>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 22px 18px 18px 18px; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05); display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <div style="position: relative; width: 168px; height: 168px;">
        <svg width="168" height="168" viewBox="0 0 168 168" aria-hidden="true">
          <circle cx="84" cy="84" r="74" fill="none" stroke="rgba(42, 82, 240, 0.14)" stroke-width="14"></circle>
          <circle cx="84" cy="84" r="74" fill="none" stroke="#2A52F0" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{calDash}}" transform="rotate(-90 84 84)"></circle>
          <circle cx="84" cy="84" r="54" fill="none" stroke="rgba(245, 166, 35, 0.16)" stroke-width="14"></circle>
          <circle cx="84" cy="84" r="54" fill="none" stroke="#F5A623" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{carbDash}}" transform="rotate(-90 84 84)"></circle>
        </svg>
        <div style="position: absolute; top: 0px; left: 0px; width: 168px; height: 168px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0px;">
          <div style="font-size: 26px; line-height: 28px; font-weight: 800; letter-spacing: -0.03em; color: #1F3FC9;">71%</div>
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6F6E67;">of target</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%;">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 16px; background: #FAF9F5;">
          <div style="font-size: 12px; font-weight: 700; color: #6F6E67;">Eaten</div>
          <div style="display: flex; align-items: baseline; gap: 3px; flex-wrap: wrap;"><span style="font-size: 22px; line-height: 24px; font-weight: 800; letter-spacing: -0.02em; color: #1F3FC9;">2,200</span><span style="font-size: 12px; font-weight: 700; color: #6F6E67;">/ 3,100 kcal</span></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 16px; background: #FAF9F5;">
          <div style="font-size: 12px; font-weight: 700; color: #6F6E67;">Carbs</div>
          <div style="display: flex; align-items: baseline; gap: 3px; flex-wrap: wrap;"><span style="font-size: 22px; line-height: 24px; font-weight: 800; letter-spacing: -0.02em; color: #A65E00;">260</span><span style="font-size: 12px; font-weight: 700; color: #6F6E67;">/ 420 g</span></div>
        </div>
      </div>
      <a href="Log.dc.html" style="align-self: stretch; height: 46px; border-radius: 15px; background: #F3F2EE; color: #1B1A19; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px;">
        <span>Forgot to log something?</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
      </a>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px 18px 18px; box-shadow: 0 0 0 1px rgba(245, 166, 35, 0.4), 0 10px 30px rgba(27, 26, 25, 0.05); display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 6px; color: #A65E00; font-size: 15px; font-weight: 700;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
        <span>Topping up for your long run</span>
      </div>
      <div style="font-size: 15px; line-height: 22px; font-weight: 500; color: #1B1A19;">+60 g carbs before your run and again at lunch today, rather than the whole gap at once.</div>
      <div style="display: flex; gap: 8px; font-size: 13px; font-weight: 700;">
        <span style="padding: 5px 10px; border-radius: 999px; background: rgba(245, 166, 35, 0.16); color: #A65E00;">Pre-run +60 g</span>
        <span style="padding: 5px 10px; border-radius: 999px; background: rgba(245, 166, 35, 0.16); color: #A65E00;">Lunch +60 g</span>
      </div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px;">
    <a href="TodayFuel.dc.html" style="width: 100%; height: 54px; box-sizing: border-box; border-radius: 17px; background: #1B1A19; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center;">Got it</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dash = (r, pct) => { const c = 2 * Math.PI * r; return (c * Math.min(1, pct)).toFixed(1) + ' ' + c.toFixed(1); };
    return {
      calDash: dash(74, 2200 / 3100),
      carbDash: dash(54, 260 / 420)
    };
  }
}
</script>
</body>
</html>
