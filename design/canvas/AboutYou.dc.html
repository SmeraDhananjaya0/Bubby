<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — about you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1F3FC9;text-decoration:none}a:hover{color:#1733A8}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #1B1A19; background: radial-gradient(90% 40% at 6% -4%, rgba(110, 140, 250, 0.42) 0%, rgba(110, 140, 250, 0) 70%), radial-gradient(80% 36% at 100% 0%, rgba(150, 190, 250, 0.42) 0%, rgba(150, 190, 250, 0) 70%), radial-gradient(70% 28% at 55% 14%, rgba(255, 222, 170, 0.34) 0%, rgba(255, 222, 170, 0) 70%), #F6F5F1;">

  <div class="scroll" style="position: absolute; top: 0px; left: 0px; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 62px 20px 130px 20px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E4E3DD;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #E4E3DD;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6E67;">Step 2 of 4</div>
      <h1 style="margin: 0; font-size: 36px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em;">About you</h1>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 6px 18px 6px 18px; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05); display: flex; flex-direction: column;">

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0px; border-bottom: 1px solid #F0EFEA;">
        <label for="age" style="font-size: 15px; font-weight: 600; color: #5E5D58;">Age</label>
        <input id="age" type="text" inputmode="numeric" defaultValue="29" style="width: 120px; border: 0px; background: transparent; text-align: right; font-size: 20px; font-weight: 800; color: #1B1A19; outline: none; padding: 0px;">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0px; border-bottom: 1px solid #F0EFEA;">
        <div style="font-size: 15px; font-weight: 600; color: #5E5D58;">Sex</div>
        <div role="group" aria-label="Sex" style="display: flex; gap: 4px; padding: 3px; border-radius: 11px; background: #F3F2EE;">
          <sc-for list="{{sexes}}" as="s" hint-placeholder-count="3">
            <button onClick="{{s.pick}}" style="height: 32px; padding: 0px 12px; border: 0px; border-radius: 8px; background: {{s.bg}}; color: {{s.color}}; box-shadow: {{s.shadow}}; font-weight: 700; font-size: 13px;">{{s.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0px; border-bottom: 1px solid #F0EFEA;">
        <label for="height" style="font-size: 15px; font-weight: 600; color: #5E5D58;">Height</label>
        <input id="height" type="text" defaultValue="5 ft 9 in" style="width: 140px; border: 0px; background: transparent; text-align: right; font-size: 20px; font-weight: 800; color: #1B1A19; outline: none; padding: 0px;">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0px; border-bottom: 1px solid #F0EFEA;">
        <label for="weight" style="font-size: 15px; font-weight: 600; color: #5E5D58;">Weight</label>
        <input id="weight" type="text" defaultValue="160 lb" style="width: 140px; border: 0px; background: transparent; text-align: right; font-size: 20px; font-weight: 800; color: #1B1A19; outline: none; padding: 0px;">
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 0px;">
        <label for="diet" style="font-size: 15px; font-weight: 600; color: #5E5D58;">Diet or allergies</label>
        <input id="diet" type="text" placeholder="e.g. vegetarian, no peanuts" style="width: 100%; box-sizing: border-box; height: 44px; padding: 0px 14px; border: 0px; border-radius: 13px; background: #F3F2EE; font-size: 15px; font-weight: 600; color: #1B1A19; outline: none;">
      </div>

    </div>

    <div style="font-size: 14px; line-height: 20px; font-weight: 500; color: #5E5D58; padding: 0px 4px;">Used only to set your calorie and protein baseline. You can change any of this later.</div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px;">
    <a href="Goal.dc.html" style="width: 100%; height: 54px; box-sizing: border-box; border-radius: 17px; background: #1B1A19; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center;">Continue</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sex: '' };
  }
  renderVals() {
    const sex = this.state.sex;
    const sexes = ['Female', 'Male', 'Other'].map((label) => ({
      label,
      pick: () => this.setState({ sex: label }),
      bg: sex === label ? '#FFFFFF' : 'transparent',
      color: sex === label ? '#1B1A19' : '#6F6E67',
      shadow: sex === label ? '0 1px 3px rgba(27, 26, 25, 0.12)' : 'none'
    }));
    return { sexes };
  }
}
</script>
</body>
</html>
