<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #1B1A19; background: radial-gradient(90% 40% at 6% -4%, rgba(110, 140, 250, 0.42) 0%, rgba(110, 140, 250, 0) 70%), radial-gradient(80% 36% at 100% 0%, rgba(150, 190, 250, 0.42) 0%, rgba(150, 190, 250, 0) 70%), radial-gradient(70% 28% at 55% 14%, rgba(255, 222, 170, 0.34) 0%, rgba(255, 222, 170, 0) 70%), #F6F5F1;">

    <div style="position: relative; width: 224px; height: 224px;">
      <svg width="224" height="224" viewBox="0 0 224 224" aria-hidden="true">
        <circle cx="112" cy="112" r="98" fill="none" stroke="rgba(42, 82, 240, 0.14)" stroke-width="18"></circle>
        <circle cx="112" cy="112" r="98" fill="none" stroke="#2A52F0" stroke-width="18" stroke-linecap="round" stroke-dasharray="{{ring1}}" transform="rotate(-90 112 112)"></circle>
        <circle cx="112" cy="112" r="72" fill="none" stroke="rgba(245, 166, 35, 0.16)" stroke-width="18"></circle>
        <circle cx="112" cy="112" r="72" fill="none" stroke="#F5A623" stroke-width="18" stroke-linecap="round" stroke-dasharray="{{ring2}}" transform="rotate(-90 112 112)"></circle>
        <circle cx="112" cy="112" r="46" fill="none" stroke="rgba(34, 179, 166, 0.16)" stroke-width="18"></circle>
        <circle cx="112" cy="112" r="46" fill="none" stroke="#22B3A6" stroke-width="18" stroke-linecap="round" stroke-dasharray="{{ring3}}" transform="rotate(-90 112 112)"></circle>
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
        <div style="font-size: 44px; line-height: 48px; font-weight: 800; letter-spacing: -0.03em;">Train for it.</div>
        <div style="font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 48px; line-height: 50px; letter-spacing: -0.01em; color: #1F3FC9;">Eat for it.</div>
      </div>
      <div style="font-size: 16px; line-height: 22px; font-weight: 500; color: #5E5D58; max-width: 280px;">Fuel that adjusts to every run you do.</div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 12px; align-items: center;">

    <div style="font-size: 12px; line-height: 16px; font-weight: 500; color: #6F6E67; text-align: center;">We read runs, heart rate and pace from Strava or Apple Health. Nothing is ever posted for you.</div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dash = (r, pct) => { const c = 2 * Math.PI * r; return (c * pct).toFixed(1) + ' ' + c.toFixed(1); };
    return {
      ring1: dash(98, 0.78),
      ring2: dash(72, 0.62),
      ring3: dash(46, 0.7)
    };
  }
}
</script>
