<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F5F1}
a{color:#1F3FC9;text-decoration:none}a:hover{color:#1733A8}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; font-family: 'Manrope', system-ui, sans-serif; color: #1B1A19; background: radial-gradient(90% 40% at 6% -4%, rgba(110, 140, 250, 0.42) 0%, rgba(110, 140, 250, 0) 70%), radial-gradient(80% 36% at 100% 0%, rgba(150, 190, 250, 0.42) 0%, rgba(150, 190, 250, 0) 70%), radial-gradient(70% 28% at 55% 14%, rgba(255, 222, 170, 0.34) 0%, rgba(255, 222, 170, 0) 70%), #F6F5F1;">

  <div class="scroll" style="position: absolute; top: 0px; left: 0px; width: 390px; height: 844px; box-sizing: border-box; overflow-y: auto; padding: 62px 20px 130px 20px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 6px; margin-bottom: 8px;">
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #2A52F0;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px;">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #6F6E67;">Marathon · Dec 6</div>
      <h1 style="margin: 0; font-size: 36px; line-height: 38px; font-weight: 800; letter-spacing: -0.02em;">Your plan</h1>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 18px 18px 18px 18px; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5E5D58;">Weeks</div>
        <div style="display: flex; align-items: baseline; gap: 3px;"><span style="font-size: 30px; line-height: 32px; font-weight: 800; letter-spacing: -0.03em; color: #1F6FB5;">11</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5E5D58;">Runs</div>
        <div style="display: flex; align-items: baseline; gap: 3px;"><span style="font-size: 30px; line-height: 32px; font-weight: 800; letter-spacing: -0.03em; color: #A65E00;">5</span><span style="font-size: 13px; font-weight: 700; color: #6F6E67;">/wk</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 13px; font-weight: 700; color: #5E5D58;">Peak</div>
        <div style="display: flex; align-items: baseline; gap: 3px;"><span style="font-size: 30px; line-height: 32px; font-weight: 800; letter-spacing: -0.03em; color: #1F3FC9;">45</span><span style="font-size: 13px; font-weight: 700; color: #6F6E67;">mi</span></div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 16px 18px 18px 18px; box-shadow: 0 1px 2px rgba(27, 26, 25, 0.04), 0 10px 30px rgba(27, 26, 25, 0.05); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 6px; color: #1F3FC9; font-size: 15px; font-weight: 700;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><path d="M4 22v-7"></path></svg>
          <span>Weekly miles</span>
        </div>
        <div style="color: #6F6E67; font-size: 13px; font-weight: 600;">11 weeks to race day</div>
      </div>
      <div style="display: flex; align-items: flex-end; gap: 6px; height: 190px;">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="11">
          <div style="flex-grow: 1; height: {{b.h}}px; border-radius: 7px; background: {{b.bg}};"></div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 6px;">
        <div style="flex-grow: 2; height: 5px; border-radius: 3px; background: rgba(42, 82, 240, 0.18);"></div>
        <div style="flex-grow: 4; height: 5px; border-radius: 3px; background: rgba(42, 82, 240, 0.36);"></div>
        <div style="flex-grow: 2; height: 5px; border-radius: 3px; background: #2A52F0;"></div>
        <div style="flex-grow: 3; height: 5px; border-radius: 3px; background: rgba(42, 82, 240, 0.18);"></div>
      </div>
      <div style="display: flex; gap: 6px; font-size: 11px; font-weight: 700; color: #6F6E67; letter-spacing: 0.04em; text-transform: uppercase;">
        <div style="flex-grow: 2; flex-basis: 0px;">Base</div>
        <div style="flex-grow: 4; flex-basis: 0px;">Build</div>
        <div style="flex-grow: 2; flex-basis: 0px; color: #1F3FC9;">Peak</div>
        <div style="flex-grow: 3; flex-basis: 0px;">Taper</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(61, 184, 119, 0.12);">
      <div style="color: #1F7F4A; display: flex; flex-shrink: 0; padding-top: 1px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.5 19 2c1 2 2 4.2 2 8 0 5.5-4.8 10-10 10z"></path><path d="M2 21c0-3 1.9-5.4 5.1-6C9.5 14.5 12 13 13 12"></path></svg>
      </div>
      <div style="font-size: 13px; line-height: 18px; font-weight: 600; color: #14532D;">Calories and carbs rise on big days and ease off on rest days. Protein stays steady all the way through.</div>
    </div>

  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px;">
    <a href="TodayFuel.dc.html" style="width: 100%; height: 54px; box-sizing: border-box; border-radius: 17px; background: #1B1A19; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center;">Start training</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const miles = [22, 25, 28, 31, 35, 38, 42, 45, 32, 24, 14];
    const phase = ['base', 'base', 'build', 'build', 'build', 'build', 'peak', 'peak', 'taper', 'taper', 'taper'];
    const bg = { base: 'rgba(42, 82, 240, 0.18)', build: 'rgba(42, 82, 240, 0.36)', peak: '#2A52F0', taper: 'rgba(42, 82, 240, 0.18)' };
    const bars = miles.map((m, i) => ({ h: Math.round((m / 45) * 190), bg: bg[phase[i]] }));
    return { bars };
  }
}
</script>
</body>
</html>
