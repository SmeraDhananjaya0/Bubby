<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <title>Bubbie</title>
    <meta name="description" content="Marathon training where fuel follows the workout." />
    <meta name="theme-color" content="#F6F5F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bubbie" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.ico" />
    <style id="expo-reset">
      html, body { height: 100%; background: #F6F5F1; }
      body { overflow: hidden; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; margin: 0; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Phone-width frame on wide screens so the app reads like the design on desktop too. */
      @media (min-width: 720px) {
        body { display: flex; justify-content: center; }
        #root { width: 430px; max-width: 100%; box-shadow: 0 0 0 1px rgba(27,26,25,0.06), 0 30px 80px rgba(27,26,25,0.10); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Bubbie.</noscript>
    <div id="root"></div>
  </body>
</html>
